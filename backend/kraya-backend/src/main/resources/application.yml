logging:
  level:
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG

spring:
  application:
    name: kraya-backend

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public
    create-schemas: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-stacktrace: always

management:
  endpoints:
    web:
      exposure:
        include: health,info


jwt:
  secret: ${JWT_SECRET}
  expiration: 900000

kraya:
  auth:
    refresh-token-days: 7
    cookie-secure: false